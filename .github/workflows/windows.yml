name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Download WiX 3.14.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'wix'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX download checksum mismatch.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          "SPICY_WIX_BIN=$bin" >> $env:GITHUB_ENV
      - name: Test and build installer
        shell: pwsh
        run: |
          $version = '0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          .\scripts\package-windows.ps1 -Version $version -WixBin $env:SPICY_WIX_BIN
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $app = Resolve-Path 'desktop/build/package/SpicyLyrics/SpicyLyrics.exe'
          $testDir = Join-Path $env:RUNNER_TEMP 'spicy-smoke'
          $result = Start-Process -FilePath $app -ArgumentList ('--smoke-check "' + $testDir + '"') -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            throw "Packaged app smoke test failed with exit code $($result.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: desktop/build/package/*.msi*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
      - name: Attach installer to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" ./*.msi ./*.msi.sha256
          --draft --verify-tag --generate-notes
